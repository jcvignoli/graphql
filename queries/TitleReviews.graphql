query TitleReviews($id: ID!) {
  title(id: $id) {
    id
    reviews(first: 5) {
      edges {
        node {
          id
          author {
            nickName
          }
          summary {
            originalText
          }
          text {
            originalText {
              plainText
            }
          }
          authorRating
        }
      }
    }
  }
}